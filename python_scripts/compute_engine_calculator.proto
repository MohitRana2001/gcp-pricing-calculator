syntax = "proto3";

package cloud.ux.api.webplatform.pricing;

option java_multiple_files = true;
option java_package = "com.google.cloud.ux.api.webplatform.pricing.proto";

// --- Enums for the Deeplink ---

enum PricingFormType {
  PRICING_FORM_TYPE_UNSPECIFIED = 0;
  PRICING_FORM_TYPE_COMPUTE_ENGINE = 8;
}

enum PricingFormServiceType {
  PRICING_FORM_SERVICE_TYPE_UNSPECIFIED = 0;
  PRICING_FORM_SERVICE_TYPE_COMPUTE_ENGINE_FOR_INSTANCES = 9;
}

// --- Enums for the Detailed Form Fields (Compute Engine Only) ---

enum PricingFormFieldType {
  PRICING_FORM_FIELD_TYPE_UNSPECIFIED = 0;
  PRICING_FORM_FIELD_TYPE_COMPUTE_ENGINE_INSTANCES_NUMBER_OF_INSTANCES = 102;
  PRICING_FORM_FIELD_TYPE_COMPUTE_ENGINE_INSTANCES_SELECT_MACHINE_TYPE = 108;
  PRICING_FORM_FIELD_TYPE_COMPUTE_ENGINE_INSTANCES_DATACENTER_LOCATION = 115;
  PRICING_FORM_FIELD_TYPE_COMPUTE_ENGINE_INSTANCES_BOOT_DISK_SIZE = 111;
}

// --- Messages for the Simple Deeplink ---

message PricingDeeplinkQuery {
  optional SolutionDiscoveryUseCaseDetails solution_discovery_use_case_details = 4;
  optional string estimate_id = 1;
}

message SolutionDiscoveryUseCaseDetails {
  optional string use_case_estimate_id = 3;
  repeated SolutionDiscoveryUseCaseProduct products = 2;
}

message SolutionDiscoveryUseCaseProduct {
  optional PricingFormType form_type = 1;
  optional PricingFormServiceType service_type = 2;
}

// --- Messages for the Advanced/Detailed Form Data ---

message PricingFormData {
  optional PricingFormType form_type = 1;
  optional string form_id = 2;
  optional string display_name = 8;
  repeated PricingFormDataServiceTypeForm service_type_forms = 11;
}

message PricingFormDataServiceTypeForm {
  optional PricingFormServiceType service_type = 1;
  repeated PricingFormDataField field_values = 2;
}

message PricingFormDataField {
  optional PricingFormFieldType field_type = 1;
  optional PricingFormFieldValue value = 2;
}

message PricingFormFieldValue {
  message KeyValue {
    optional string key = 1;
  }
  oneof value {
    string string_value = 1;
    KeyValue key_value = 3;
    double numeric_value = 10;
    bool bool_value = 6;
  }
}